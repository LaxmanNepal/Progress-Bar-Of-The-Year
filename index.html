<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050607"><meta name="description" content="Live year progress bar showing how much of the current year has passed."><title>Progress Bar Of the Year | Laxman Nepal</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#050607;color:#fff}body{display:flex;align-items:center;justify-content:center;padding:20px}main{width:min(900px,100%);text-align:center}.card{padding:28px 18px;border-radius:24px;background:#101315;border:1px solid #292d30;box-shadow:0 20px 60px rgba(0,0,0,.35)}h1{font-size:clamp(2rem,9vw,5rem);margin:20px 0;line-height:1.05}p{font-size:clamp(1rem,4vw,1.5rem);color:#aab0b5}.label{display:flex;justify-content:space-between;gap:12px;margin:35px 0 10px;color:#c9ced2;font-weight:bold}.bar{height:70px;width:100%;background:#34383b;border-radius:18px;overflow:hidden;box-shadow:inset 0 0 12px #000}.fill{height:100%;width:0%;background:linear-gradient(90deg,#00c853,#69f0ae,#00c853);background-size:200% 100%;border-radius:18px;position:relative;transition:width 2.5s cubic-bezier(.22,1,.36,1);animation:shine 2.2s linear infinite}.fill:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:sweep 1.8s infinite}.fill:before{content:"";position:absolute;right:0;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 18px 5px rgba(105,240,174,.8);transform:translate(50%,-50%);animation:pulse 1.4s ease-in-out infinite}@keyframes shine{to{background-position:-200% 0}}@keyframes sweep{to{transform:translateX(100%)}}@keyframes pulse{50%{opacity:.55;box-shadow:0 0 28px 8px rgba(105,240,174,.95)}}.value{font-size:1.3rem;font-weight:bold}.remaining{margin-top:20px;font-size:1rem;color:#8f979d}.remaining strong{color:#fff}.controls{display:flex;justify-content:center;gap:10px;margin-top:24px;flex-wrap:wrap}.controls button{border:1px solid #363c40;background:#1b2023;color:#fff;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}.controls button.active{background:#00c853;border-color:#00c853;color:#001b0b}.extra{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.stat{padding:14px 8px;border-radius:14px;background:#171b1e;border:1px solid #292e31}.stat b{display:block;font-size:1.15rem}.stat span{display:block;margin-top:5px;color:#818a90;font-size:.8rem}@media(max-width:520px){.extra{grid-template-columns:1fr}.bar{height:58px}}@media(prefers-reduced-motion:reduce){.fill{animation:none;transition:none}.fill:after,.fill:before{animation:none}}</style></head><body><main><div class="card"><h1><span id="yearPercent">0</span>% of <span id="currentYear">2026</span> has passed</h1><p id="dateText">Loading date...</p><div class="label"><span>YEAR PROGRESS</span><span class="value"><span id="progressValue">0.0</span>%</span></div><div class="bar" aria-label="Year progress"><div class="fill" id="progressBar"></div></div><div class="remaining" id="remainingText">Calculating remaining time…</div><div class="controls"><button id="liveBtn" class="active" type="button">LIVE</button><button id="pauseBtn" type="button">PAUSE</button></div><div class="extra"><div class="stat"><b id="daysPassed">0</b><span>DAYS PASSED</span></div><div class="stat"><b id="daysLeft">0</b><span>DAYS LEFT</span></div><div class="stat"><b id="secondsLeft">0</b><span>SECONDS LEFT</span></div></div><small>Progress Bar Of the Year By Laxman Nepal</small></div></main><script>(function(){var bar=document.getElementById('progressBar'),whole=document.getElementById('yearPercent'),value=document.getElementById('progressValue'),remaining=document.getElementById('remainingText'),dateText=document.getElementById('dateText'),daysPassed=document.getElementById('daysPassed'),daysLeft=document.getElementById('daysLeft'),secondsLeft=document.getElementById('secondsLeft'),liveBtn=document.getElementById('liveBtn'),pauseBtn=document.getElementById('pauseBtn');var running=true,lastYear=0;function update(){if(!running)return;var now=new Date(),year=now.getFullYear(),start=new Date(year,0,1),end=new Date(year+1,0,1),ms=end-now,p=((now-start)/(end-start))*100;p=Math.max(0,Math.min(100,p));document.getElementById('currentYear').textContent=year;dateText.textContent=now.toLocaleString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'});bar.style.width=p+'%';whole.textContent=Math.floor(p);value.textContent=p.toFixed(4);var passedMs=now-start,dp=Math.floor(passedMs/86400000),dl=Math.ceil(ms/86400000),sl=Math.floor(ms/1000);daysPassed.textContent=dp;daysLeft.textContent=dl;secondsLeft.textContent=sl.toLocaleString();remaining.innerHTML='<strong>'+Math.floor(ms/86400000)+' days '+Math.floor(ms/3600000)%24+' hours '+Math.floor(ms/60000)%60+' minutes '+Math.floor(ms/1000)%60+' seconds</strong> remaining in '+year;if(year!==lastYear){lastYear=year;bar.style.width='0%';requestAnimationFrame(function(){bar.style.width=p+'%'});}}function setRunning(v){running=v;liveBtn.classList.toggle('active',v);pauseBtn.classList.toggle('active',!v);if(v)update()}liveBtn.onclick=function(){setRunning(true)};pauseBtn.onclick=function(){setRunning(false)};update();setInterval(update,1000);})();</script></body></html>
