<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b0a"><meta name="description" content="Live year progress dashboard showing how much of the current year has passed."><title>Progress Bar Of the Year | Laxman Nepal</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#050806;color:#fff}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;overflow-x:hidden}body:before,body:after{content:"";position:fixed;width:38vw;height:38vw;border-radius:50%;filter:blur(70px);opacity:.18;pointer-events:none;background:#00c853}body:before{top:-15vw;left:-12vw}body:after{right:-15vw;bottom:-15vw;background:#69f0ae}main{width:min(920px,100%);position:relative;z-index:1}.card{padding:clamp(22px,5vw,46px);border:1px solid rgba(255,255,255,.12);border-radius:32px;background:rgba(16,21,18,.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 30px 100px rgba(0,0,0,.5)}.brand{display:flex;align-items:center;justify-content:center;gap:9px;color:#8e9b94;font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.dot{width:8px;height:8px;border-radius:50%;background:#00e676;box-shadow:0 0 14px #00e676;animation:blink 1.6s infinite}h1{font-size:clamp(2.25rem,9vw,5.7rem);letter-spacing:-.055em;line-height:.98;margin:22px auto 14px;max-width:850px}h1 .accent{background:linear-gradient(120deg,#fff,#69f0ae);-webkit-background-clip:text;background-clip:text;color:transparent}p{font-size:clamp(.95rem,3.5vw,1.2rem);color:#9fa9a4;margin:0}.label{display:flex;justify-content:space-between;gap:12px;margin:42px 0 11px;color:#aab5af;font-size:.78rem;letter-spacing:.12em;font-weight:800}.value{color:#fff;font-size:1rem;letter-spacing:0}.bar{height:76px;width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);border-radius:22px;overflow:hidden;box-shadow:inset 0 2px 14px rgba(0,0,0,.5)}.fill{height:100%;width:0%;background:linear-gradient(90deg,#00a844,#00e676,#b9ffd7,#00c853);background-size:220% 100%;border-radius:20px;position:relative;transition:width 1s linear;animation:shine 2.8s linear infinite}.fill:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-100%);animation:sweep 2.2s infinite}.fill:before{content:"";position:absolute;right:0;top:50%;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 20px 6px rgba(105,240,174,.95);transform:translate(50%,-50%);animation:pulse 1.5s ease-in-out infinite}.remaining{margin-top:19px;color:#89948e;font-size:.92rem}.remaining strong{color:#fff;font-variant-numeric:tabular-nums}.controls{display:flex;justify-content:center;gap:9px;margin-top:25px}.controls button{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#cbd3cf;border-radius:14px;padding:10px 18px;font-weight:800;cursor:pointer;transition:.2s}.controls button:hover{transform:translateY(-1px);background:rgba(255,255,255,.1)}.controls button.active{background:#00c853;color:#001b0b;border-color:#00c853;box-shadow:0 0 24px rgba(0,200,83,.2)}.extra{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.stat{padding:17px 10px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}.stat b{display:block;font-size:clamp(1.05rem,4vw,1.45rem);font-variant-numeric:tabular-nums}.stat span{display:block;margin-top:6px;color:#77837c;font-size:.7rem;font-weight:800;letter-spacing:.08em}footer{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:28px;color:#66716b;font-size:.75rem}footer a{color:#9aa69f;text-decoration:none}footer a:hover{color:#69f0ae}@keyframes shine{to{background-position:-220% 0}}@keyframes sweep{to{transform:translateX(100%)}}@keyframes pulse{50%{opacity:.55;box-shadow:0 0 30px 9px rgba(105,240,174,.95)}}@keyframes blink{50%{opacity:.3;transform:scale(.75)}}@media(max-width:600px){body{padding:12px}.card{border-radius:25px;padding:25px 16px}.bar{height:58px;border-radius:17px}.fill{border-radius:15px}.extra{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.label{margin-top:32px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(prefers-color-scheme:light){body{background:#edf3ef;color:#102017}.card{background:rgba(255,255,255,.72);border-color:rgba(0,0,0,.08)}h1{color:#102017}.fill{transition:none}.stat{background:rgba(0,0,0,.035);border-color:rgba(0,0,0,.06)}.remaining strong,.value{color:#102017}.controls button{color:#304038}}</style></head><body><main><section class="card"><div class="brand"><span class="dot"></span>Live Year Tracker</div><h1><span id="yearPercent">0</span>% of <span class="accent" id="currentYear">2026</span> has passed</h1><p id="dateText">Loading date...</p><div class="label"><span>YEAR PROGRESS</span><span class="value"><span id="progressValue">0.0000</span>%</span></div><div class="bar" role="progressbar" aria-label="Year progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="progressBar"></div></div><div class="remaining" id="remainingText">Calculating remaining time…</div><div class="controls"><button id="liveBtn" class="active" type="button">● LIVE</button><button id="pauseBtn" type="button">Ⅱ PAUSE</button></div><div class="extra"><div class="stat"><b id="daysPassed">0</b><span>DAYS PASSED</span></div><div class="stat"><b id="daysLeft">0</b><span>DAYS LEFT</span></div><div class="stat"><b id="secondsLeft">0</b><span>SECONDS LEFT</span></div></div><footer>Progress Bar Of the Year <span>•</span> <a href="https://www.laxmannepal.com.np" rel="noopener">Laxman Nepal</a></footer></section></main><script>(function(){var bar=document.getElementById('progressBar'),whole=document.getElementById('yearPercent'),value=document.getElementById('progressValue'),remaining=document.getElementById('remainingText'),dateText=document.getElementById('dateText'),daysPassed=document.getElementById('daysPassed'),daysLeft=document.getElementById('daysLeft'),secondsLeft=document.getElementById('secondsLeft'),liveBtn=document.getElementById('liveBtn'),pauseBtn=document.getElementById('pauseBtn');var running=true,lastYear=0;function update(){if(!running)return;var now=new Date(),year=now.getFullYear(),start=new Date(year,0,1),end=new Date(year+1,0,1),ms=end-now,p=((now-start)/(end-start))*100;p=Math.max(0,Math.min(100,p));document.getElementById('currentYear').textContent=year;dateText.textContent=now.toLocaleString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'});bar.style.width=p+'%';bar.parentElement.setAttribute('aria-valuenow',p.toFixed(4));whole.textContent=Math.floor(p);value.textContent=p.toFixed(4);var passedMs=now-start,dp=Math.floor(passedMs/86400000),dl=Math.ceil(ms/86400000),sl=Math.floor(ms/1000);daysPassed.textContent=dp;daysLeft.textContent=dl;secondsLeft.textContent=sl.toLocaleString();remaining.innerHTML='<strong>'+Math.floor(ms/86400000)+'d '+Math.floor(ms/3600000)%24+'h '+Math.floor(ms/60000)%60+'m '+Math.floor(ms/1000)%60+'s</strong> remaining in '+year;if(year!==lastYear){lastYear=year;bar.style.width='0%';requestAnimationFrame(function(){bar.style.width=p+'%'});}}function setRunning(v){running=v;liveBtn.classList.toggle('active',v);pauseBtn.classList.toggle('active',!v);if(v)update()}liveBtn.onclick=function(){setRunning(true)};pauseBtn.onclick=function(){setRunning(false)};update();setInterval(update,1000);})();</script></body></html>
