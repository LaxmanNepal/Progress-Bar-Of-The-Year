<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050607">
  <meta name="description" content="A beautiful live progress bar showing how much of the current year has passed.">
  <title>Progress Bar of the Year</title>
  <style>
    :root{
      --bg:#050607;--card:#0b0d0f;--text:#f3f5f7;--muted:#92979f;
      --track:#424242;--green:#00c853;--green2:#00b94c;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      background:radial-gradient(circle at 50% 15%,#11161a 0,#050607 42%);
      color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      display:grid;place-items:center;overflow:hidden;
    }
    main{width:min(900px,92vw);padding:32px 0}
    .eyebrow{color:var(--muted);font-size:14px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 24px}
    h1{font-size:clamp(2.2rem,7vw,5.5rem);line-height:1.04;margin:0;font-weight:800;letter-spacing:.015em}
    .date{font-size:clamp(1.1rem,2.4vw,1.65rem);color:var(--muted);margin:14px 0 42px;letter-spacing:.06em}
    .bar{
      width:100%;height:clamp(72px,11vw,112px);background:var(--track);
      border-radius:28px;overflow:hidden;position:relative;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 18px 60px rgba(0,0,0,.35);
    }
    .fill{
      position:absolute;inset:0 auto 0 0;width:0%;
      background:linear-gradient(90deg,var(--green),var(--green2));
      border-radius:inherit;
      box-shadow:0 0 24px rgba(0,200,83,.38);
      transition:width 2200ms cubic-bezier(.16,1,.3,1);
    }
    .shine{
      position:absolute;inset:0;opacity:.25;pointer-events:none;
      background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.18) 45%,transparent 60%);
      transform:translateX(-100%);animation:shine 3.4s ease-in-out infinite 2.4s;
    }
    .stats{display:flex;justify-content:space-between;gap:20px;margin-top:24px;color:var(--muted);font-size:clamp(.9rem,2vw,1.1rem)}
    .stats strong{color:var(--text);font-variant-numeric:tabular-nums}
    @keyframes shine{50%{transform:translateX(100%)}100%{transform:translateX(100%)}}
    @media (max-width:520px){
      main{width:calc(100vw - 40px)}
      h1{font-size:2.1rem}
      .date{font-size:1rem;margin-bottom:32px}
      .bar{height:82px;border-radius:22px}
      .stats{font-size:.88rem;flex-direction:column;gap:8px}
    }
    @media (prefers-reduced-motion:reduce){.fill{transition:none}.shine{animation:none}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Year Progress</p>
    <h1 id="headline">Loading…</h1>
    <p class="date" id="date"></p>

    <div class="bar" role="progressbar" aria-label="Year progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="fill" id="fill"><div class="shine"></div></div>
    </div>

    <div class="stats">
      <span><strong id="passed">0%</strong> completed</span>
      <span><strong id="remaining">0%</strong> remaining</span>
    </div>
  </main>

  <script>
    const fill = document.getElementById('fill');
    const headline = document.getElementById('headline');
    const dateEl = document.getElementById('date');
    const passedEl = document.getElementById('passed');
    const remainingEl = document.getElementById('remaining');
    const bar = document.querySelector('.bar');

    function getYearProgress(now = new Date()){
      const year = now.getFullYear();
      const start = new Date(year,0,1);
      const end = new Date(year + 1,0,1);
      return ((now - start) / (end - start)) * 100;
    }

    function render(animate = false){
      const now = new Date();
      const year = now.getFullYear();
      const progress = Math.min(100,Math.max(0,getYearProgress(now)));
      const rounded = Math.floor(progress);
      const remaining = Math.max(0,100-progress);

      headline.textContent = rounded + '% of ' + year + ' has passed';
      dateEl.textContent = new Intl.DateTimeFormat(undefined,{
        month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false
      }).format(now).replace(',', ' ·');

      passedEl.textContent = progress.toFixed(1) + '%';
      remainingEl.textContent = remaining.toFixed(1) + '%';
      bar.setAttribute('aria-valuenow', progress.toFixed(1));

      if(animate){
        requestAnimationFrame(() => requestAnimationFrame(() => fill.style.width = progress + '%'));
      }else{
        fill.style.width = progress + '%';
      }
    }

    render(true);
    setInterval(() => render(false), 1000);
  </script>
</body>
</html>
