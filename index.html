<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050607"><meta name="description" content="Watch the current year progress from zero to the present moment."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>Progress Bar of the Year</title>
<style>
:root{--bg:#050607;--text:#f2f4f6;--muted:#8f969d;--track:#393b3d;--accent:#00c853;--accent2:#00ad49}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden;min-height:100vh;display:flex;justify-content:center;align-items:center}main{width:min(920px,calc(100% - 40px));margin:0 auto;padding:40px 0;text-align:center}.top-cylinder{width:min(760px,94vw);min-height:78px;margin:0 auto 42px;padding:20px 36px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.035) 48%,rgba(0,200,83,.08));box-shadow:inset 0 1px 1px rgba(255,255,255,.2),inset 0 -14px 32px rgba(0,0,0,.2),0 18px 55px rgba(0,0,0,.38);backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%)}.top-cylinder:before{content:"";position:absolute;inset:1px 9%;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent 72%);pointer-events:none}.top-cylinder:after{content:"";position:absolute;left:8%;right:8%;top:7px;height:1px;border-radius:50%;background:rgba(255,255,255,.2);filter:blur(.4px);pointer-events:none}.top-cylinder span{position:relative;z-index:1;font-size:clamp(.95rem,2.2vw,1.35rem);font-weight:700;letter-spacing:.045em;color:#fff;text-shadow:0 1px 14px rgba(255,255,255,.2)}.hero{margin:0 auto 42px;text-align:center}.headline{margin:0 auto;text-align:center;font-size:clamp(2.15rem,7vw,5.7rem);line-height:1.04;letter-spacing:.02em;font-weight:800}.subline{margin:14px auto 0;text-align:center;color:var(--muted);font-size:clamp(1rem,2.2vw,1.5rem);letter-spacing:.06em;font-variant-numeric:tabular-nums}.progress-section{margin:0 auto;text-align:center;width:100%}.label{display:flex;justify-content:center;align-items:baseline;gap:12px;margin:0 auto 10px;text-align:center;color:var(--muted);font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.value{color:var(--text);font-size:clamp(1.2rem,3vw,2rem);font-variant-numeric:tabular-nums}.bar{width:100%;height:clamp(60px,10vw,92px);margin:0 auto;background:var(--track);border-radius:24px;overflow:hidden;position:relative;box-shadow:inset 0 1px rgba(255,255,255,.07);text-align:left}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:inherit;will-change:width;box-shadow:0 0 28px rgba(0,200,83,.28)}.fill:after{content:"";display:block;width:35%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:translateX(-150%);animation:shine 3.5s ease-in-out infinite 1s}@keyframes shine{0%,45%{transform:translateX(-150%)}70%,100%{transform:translateX(350%)}}.sound{position:fixed;top:18px;right:18px;z-index:20;width:46px;height:46px;border:1px solid rgba(255,255,255,.12);border-radius:50%;background:rgba(20,23,25,.86);backdrop-filter:blur(14px);color:white;font-size:1.15rem;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.28)}.sound.on{background:rgba(0,200,83,.2);border-color:rgba(0,200,83,.45)}.hint{position:fixed;top:72px;right:18px;z-index:19;padding:8px 12px;border-radius:10px;background:rgba(20,23,25,.94);color:var(--muted);font-size:.7rem;opacity:0;transform:translateY(-4px);pointer-events:none;transition:.25s}.hint.show{opacity:1;transform:none}@media(max-width:560px){body{align-items:center}main{width:calc(100% - 32px);padding:30px 0}.top-cylinder{width:94vw;min-height:68px;padding:17px 20px;margin-bottom:32px}.top-cylinder span{font-size:.9rem;line-height:1.35}.bar{border-radius:18px}}@media(prefers-reduced-motion:reduce){.fill:after{animation:none}}
</style>
</head><body>
<button class="sound on" id="sound" type="button" aria-label="Disable animation sound" aria-pressed="true">🔊</button><div class="hint" id="hint">Sound is on</div>
<main><div class="top-cylinder" aria-label="Progress Bar Of the Year By Laxman Nepal"><span>Progress Bar Of the Year By Laxman Nepal</span></div><header class="hero"><h1 class="headline"><span id="yearPercent">0</span>% of <span id="yearNumber">2026</span> has passed</h1><p class="subline" id="dateText">Loading date…</p></header><section class="progress-section"><div class="label"><span>Year progress</span><span class="value"><span id="progressValue">0.0</span>%</span></div><div class="bar" role="progressbar" aria-label="Year progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="progressBar"></div></div></section></main>
<script>
(()=>{const $=id=>document.getElementById(id),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let audio=null,gain=null,soundOn=true,soundTimer=null,soundStartedAt=0;
function audioInit(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;if(!audio)audio=new C();if(audio.state==='suspended')audio.resume();if(!gain){gain=audio.createGain();gain.gain.value=1;gain.connect(audio.destination)}return true}
function startAnimationSound(duration){if(!soundOn||!audioInit())return;stopAnimationSound();const t=audio.currentTime+.05;const o=audio.createOscillator(),lfo=audio.createOscillator(),lg=audio.createGain(),og=audio.createGain();o.type='sine';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(520,t+duration/1000);lfo.type='sine';lfo.frequency.value=2.2;lg.gain.value=35;lfo.connect(lg);lg.connect(o.frequency);og.gain.setValueAtTime(.0001,t);og.gain.linearRampToValueAtTime(.22,t+.35);og.gain.setValueAtTime(.22,t+duration/1000-.8);og.gain.exponentialRampToValueAtTime(.0001,t+duration/1000);o.connect(og);og.connect(gain);o.start(t);lfo.start(t);o.stop(t+duration/1000+.05);lfo.stop(t+duration/1000+.05);soundStartedAt=performance.now();soundTimer=setTimeout(()=>{stopAnimationSound()},duration+100)}
function stopAnimationSound(){if(soundTimer){clearTimeout(soundTimer);soundTimer=null}if(audio)try{audio.resume()}catch(e){}}
$('sound').onclick=()=>{soundOn=!soundOn;if(soundOn){if(!audioInit()){soundOn=false;return}$('sound').textContent='🔊';$('sound').classList.add('on');$('sound').setAttribute('aria-pressed','true');$('sound').setAttribute('aria-label','Disable animation sound');startAnimationSound(10000)}else{$('sound').textContent='🔇';$('sound').classList.remove('on');$('sound').setAttribute('aria-pressed','false');$('sound').setAttribute('aria-label','Enable animation sound');stopAnimationSound()}};
function metrics(n){const y=2026,ys=new Date(y,0,1),ny=new Date(y+1,0,1);return{year:y,date:new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric'}).format(n),yp:Math.max(0,Math.min(100,(n-ys)/(ny-ys)*100))}}
function animateNumber(el,a,b,d,f=v=>Math.round(v)){if(reduce){el.textContent=f(b);return}const st=performance.now();function go(t){const p=Math.min(1,(t-st)/d),e=1-Math.pow(1-p,4);el.textContent=f(a+(b-a)*e);if(p<1)requestAnimationFrame(go);else el.textContent=f(b)}requestAnimationFrame(go)}
function animateBar(v,d){const bar=$('progressBar'),start=performance.now();if(reduce){bar.style.width=v+'%';$('progressValue').textContent=v.toFixed(1);return}function go(t){const p=Math.min(1,(t-start)/d),e=1-Math.pow(1-p,4),current=v*e;bar.style.width=current+'%';$('progressValue').textContent=current.toFixed(1);bar.parentElement.setAttribute('aria-valuenow',current.toFixed(2));if(p<1)requestAnimationFrame(go);else{bar.style.width=v+'%';$('progressValue').textContent=v.toFixed(1);bar.parentElement.setAttribute('aria-valuenow',v.toFixed(2))}}requestAnimationFrame(go)}
function initial(){const m=metrics(new Date()),d=10000;$('dateText').textContent=m.date;animateNumber($('yearPercent'),0,Math.floor(m.yp),d);animateBar(m.yp,d);if(soundOn&&!reduce)startAnimationSound(d);setTimeout(live,d+40)}
function live(){const m=metrics(new Date());$('yearPercent').textContent=Math.floor(m.yp);$('yearNumber').textContent='2026';$('progressValue').textContent=m.yp.toFixed(1);$('dateText').textContent=m.date;$('progressBar').style.width=m.yp+'%';$('progressBar').parentElement.setAttribute('aria-valuenow',m.yp.toFixed(2));setTimeout(live,1000-Date.now()%1000+8)}initial();})();
</script></body></html>
