<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Progress Bar Of the Year | Laxman Nepal</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#050607;color:#fff}
body{display:flex;align-items:center;justify-content:center;padding:20px}
main{width:min(900px,100%);text-align:center}
.card{padding:28px 18px;border-radius:24px;background:#101315;border:1px solid #292d30}
h1{font-size:clamp(2rem,9vw,5rem);margin:20px 0}
p{font-size:clamp(1rem,4vw,1.5rem);color:#aab0b5}
.label{display:flex;justify-content:space-between;margin:35px 0 10px;color:#c9ced2;font-weight:bold}
.bar{height:70px;width:100%;background:#34383b;border-radius:18px;overflow:hidden}
.fill{height:100%;width:0%;background:#00c853;transition:width 1s ease}
.value{font-size:1.3rem;font-weight:bold}
small{display:block;margin-top:30px;color:#80878d}
</style>
</head>
<body>
<main><div class="card">
<h1><span id="yearPercent">0</span>% of <span id="currentYear">2026</span> has passed</h1>
<p id="dateText">Loading date...</p>
<div class="label"><span>YEAR PROGRESS</span><span class="value"><span id="progressValue">0.0</span>%</span></div>
<div class="bar"><div class="fill" id="progressBar"></div></div>
<small>Progress Bar Of the Year By Laxman Nepal</small>
</div></main>
<script>
(function(){
function update(){
var now=new Date(),year=now.getFullYear(),start=new Date(year,0,1),end=new Date(year+1,0,1);
var percent=((now.getTime()-start.getTime())/(end.getTime()-start.getTime()))*100;
percent=Math.max(0,Math.min(100,percent));
document.getElementById('currentYear').textContent=year;
document.getElementById('yearPercent').textContent=Math.floor(percent);
document.getElementById('progressValue').textContent=percent.toFixed(1);
document.getElementById('progressBar').style.width=percent+'%';
document.getElementById('dateText').textContent=now.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
}
update();setInterval(update,60000);
})();
</script>
</body></html>
