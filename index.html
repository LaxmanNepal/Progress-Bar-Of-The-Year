<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b0a"><meta name="description" content="Live year progress dashboard with optional cinematic 1080p video export."><title>Progress Bar Of the Year | Laxman Nepal</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#050806;color:#fff}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;overflow-x:hidden}body:before,body:after{content:"";position:fixed;width:38vw;height:38vw;border-radius:50%;filter:blur(70px);opacity:.18;pointer-events:none;background:#00c853}body:before{top:-15vw;left:-12vw}body:after{right:-15vw;bottom:-15vw;background:#69f0ae}main{width:min(920px,100%);position:relative;z-index:1}.card{padding:clamp(22px,5vw,46px);border:1px solid rgba(255,255,255,.12);border-radius:32px;background:rgba(16,21,18,.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 30px 100px rgba(0,0,0,.5)}.brand{display:flex;align-items:center;justify-content:center;gap:9px;color:#8e9b94;font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.dot{width:8px;height:8px;border-radius:50%;background:#00e676;box-shadow:0 0 14px #00e676;animation:blink 1.6s infinite}h1{font-size:clamp(2.25rem,9vw,5.7rem);letter-spacing:-.055em;line-height:.98;margin:22px auto 14px;max-width:850px}h1 .accent{background:linear-gradient(120deg,#fff,#69f0ae);-webkit-background-clip:text;background-clip:text;color:transparent}p{font-size:clamp(.95rem,3.5vw,1.2rem);color:#9fa9a4;margin:0}.label{display:flex;justify-content:space-between;gap:12px;margin:42px 0 11px;color:#aab5af;font-size:.78rem;letter-spacing:.12em;font-weight:800}.value{color:#fff;font-size:1rem;letter-spacing:0}.bar{height:76px;width:100%;background:rgba(255,255,255,.07);border:1px solid rgb r:#78847d;margin:0 0 14px}.choices{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}.choice{min-width:72px!important;padding:8px 11px!important;font-size:.72rem}.choice.selected{background:rgba(105,240,174,.14);border-color:#69f0ae;color:#69f0ae}.export-actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.export button{font-size:.78rem;padding:10px 14px}.export-status{min-height:18px;margin-top:10px;color:#9fa9a4;font-size:.72rem}.export-progress{height:5px;margin-top:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;display:none}.export-progress i{display:block;height:100%;width:0;background:#69f0ae;transition:width .1s linear}.share-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}.share-actions select{border:1px solid rgba(255,255,255,.12);background:#182019;color:#cbd3cf;border-radius:12px;padding:10px 12px;font-weight:700}.share-actions button{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#cbd3cf;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer}.share-actions button:active{transform:scale(.97)}footer{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:28px;color:#66716b;font-size:.75rem}footer a{color:#9aa69f;text-decoration:none}footer a:hover{color:#69f0ae}@keyframes shine{to{background-position:-220% 0}}@keyframes sweep{to{transform:translateX(100%)}}@keyframes pulse{50%{opacity:.55;box-shadow:0 0 30px 9px rgba(105,240,174,.95)}}@keyframes blink{50%{opacity:.3;transform:scale(.75)}}@media(max-width:600px){body{padding:12px}.card{border-radius:25px;padding:25px 16px}.bar{height:58px;border-radius:17px}.fill{border-radius:15px}.extra{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.label{margin-top:32px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(prefers-color-scheme:light){body{background:#edf3ef;colo button class="primary" id="exportLandscape" type="button">▶ 16:9 · 1080p</button><button id="exportPortrait" type="button">▶ 9:16 · 1080p</button><button id="cancelExport" type="button" hidden>✕ CANCEL</button></div><div class="export-progress" id="exportProgress"><i id="exportProgressFill"></i></div><div class="export-status" id="exportStatus" aria-live="polite"></div></section><footer>Progress Bar Of the Year <span>•</span> <a href="https://www.laxmannepal.com.np" rel="noopener">Laxman Nepal</a><div class="share-actions"><button id="shareCard" type="button">🖼️ SHARE CARD</button><select id="cardFormat" aria-label="Share card format"><option value="instagram">Instagram Post</option><option value="story">Story</option><option value="facebook">Facebook</option><option value="youtube">YouTube Community</option></select><button id="copyLink" type="button">🔗 COPY LINK</button><button id="sharePage" type="button">↗ SHARE</button></div></footer></section></main><script>(function(){var bar=document.getElementById('progressBar'),whole=document.getElementById('yearPercent'),value=document.getElementById('progressValue'),remaining=document.getElementById('remainingText'),dateText=document.getElementById('dateText'),daysPassed=document.getElementById('daysPassed'),daysLeft=document.getElementById('daysLeft'),secondsLeft=document.getElementById('secondsLeft'),liveBtn=document.getElementById('liveBtn'),pauseBtn=document.getElementById('pauseBtn'),exportLandscape=document.getElementById('exportLandscape'),exportPortrait=document.getElementById('exportPortrait'),cancelExport=document.getElementById('cancelExport'),exportStatus=document.getElementById('exportStatus'),exportProgress=document.getElementById('exportProgress'),exportProgressFill=document.getElementById('exportProgressFill');var running=true,lastYear=0,selectedDuration=30;function getProgress(now){var year=now.getFullYear(),start=new Date(year,0,1),end=new Date(year+1,0,1);return {year:year,start:start,end:end,p:Math.max(0,Math.min(100,(now-start)/(end-start)*100)),ms:end-now}}function update(){if(!running)return;var now=new Date(),d=getProgress(now),p=d.p;document.getElementById('currentYear').textContent=d.year;dateText.textContent=now.toLocaleString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'});bar.style.width=p+'%';bar.parentElement.setAttribute('aria-valuenow',p.toFixed(4));whole.textContent=Math.floor(p);value.textContent=p.toFixed(4);var passedMs=now-d.start,dp=Math.floor(passedMs/86400000),dl=Math.ceil(d.ms/86400000),sl=Math.floor(d.ms/1000);daysPassed.textContent=dp;daysLeft.textContent=dl;secondsLeft.textContent=sl.toLocaleString();remaining.innerHTML='<strong>'+Math.floor(d.ms/86400000)+'d '+Math.floor(d.ms/3600000)%24+'h '+Math.floor(d.ms/60000)%60+'m '+Math.floor(d.ms/1000)%60+'s</strong> remaining in '+d.year;if(d.year!==lastYear){lastYear=d.year;bar.style.width='0%';requestAnimationFrame(function(){bar.style.width=p+'%'})}}function setRunning(v){running=v;liveBtn.classList.toggle('active',v);pauseBtn.classList.toggle('active',!v);if(v)update()}liveBtn.onclick=function(){setRunning(true)};pauseBtn.onclick=function(){setRunning(false)};document.querySelectorAll('.choice').forEach(function(btn){btn.onclick=function(){if(exporting)return;selectedDuration=Number(btn.dataset.duration);document.querySelectorAll('.choice').forEach(function(b){b.classList.toggle('selected',b===btn)})}});var exporting=false,raf=0,rec=null,stream=null;function pickMime(){var types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];for(var i=0;i<types.length;i++)if(window.MediaRecorder&&MediaRecorder.isTypeSupported(types[i]))return types[i];return ''}function startExport(orientation){if(exporting)return;if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){exportStatus.textContent='This browser does not support in-browser video export.';return}var mime=pickMime();if(!mime){exportStatus.textContent='No supported WebM video encoder was found.';return}exporting=true;exportLandscape.disabled=true;exportPortrait.disabled=true;document.querySelectorAll('.choice').forEach(function(b){b.disabled=true});cancelExport.hidden=false;exportProgress.style.display='block';exportProgressFill.style.width='0%';var w=orientation==='landscape'?1920:1080,h=orientation==='landscape'?1080:1920,canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;var ctx=canvas.getContext('2d'),chunks=[],mimeType=mime;stream=canvas.captureStream(30);try{rec=new MediaRecorder(stream,{mimeType:mimeType,videoBitsPerSecond:H*.890000})}catch(e){finishExport(true);return}var duration=selectedDuration*1000,start=performance.now(),year=new Date().getFullYear();exportStatus.textContent='Preparing '+selectedDuration+'s cinematic '+(orientation==='landscape'?'16:9':'9:16')+' 1080p export…';rec.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};rec.onerror=function(){finishExport(true)};rec.onstop=function(){if(!exporting)return;var blob=new Blob(chunks,{type:mimeType}),url=URL.createObjectURL(blob),a=document.createElement('a'),name='progress-bar-'+year+'-'+selectedDuration+'s-'+(orientation==='landscape'?'1080p-16x9':'1080p-9x16')+'.webm';a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},2000);exportStatus.textContent='Export complete — '+selectedDuration+'s 1080p WebM ready.';exportProgressFill.style.width='100%';exporting=false;cancelExport.hidden=true;exportLandscape.disabled=false;exportPortrait.disabled=false;document.querySelectorAll('.choice').forEach(function(b){b.disabled=false});setTimeout(function(){exportProgress.style.display='none'},1800);cleanup()};rec.start(250);raf=requestAnimationFrame(draw)}function draw(t){if(!exporting)return;var ratio=Math.min(1,(t-start)/(selectedDuration*1000)),p=ratio*100;ctx.clearRect(0,0,w,h);var g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#030705');g.addColorStop(.5,'#0a1710');g.addColorStop(1,'#10271a');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);var glow=ctx.createRadialGradient(w*.5,h*.5,0,w*.5,h*.5,Math.max(w,h)*.55);glow.addColorStop(0,'rgba(0,230,118,.18)');glow.addColorStop(1,'rgba(0,230,118,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);for(var i=0;i<22;i++){var px=(i*137+ratio*w*.12)%w,py=(i*79+Math.sin(ratio*8+i)*25+h*.2)%h;ctx.beginPath();ctx.arc(px,py,Math.max(2,w*.0015),0,Math.PI*2);ctx.fillStyle='rgba(185,255,215,.25)';ctx.fill()}ctx.textAlign='center';ctx.fillStyle='#8e9b94';ctx.font='800 '+Math.round(w*.018)+'px Arial';ctx.fillText('PROGRESS BAR OF THE YEAR',w/2,h*.17);ctx.fillStyle='#69f0ae';ctx.font='800 '+Math.round(w*.025)+'px Arial';ctx.fillText(String(year),w/2,h*.25);ctx.fillStyle='#fff';ctx.font='800 '+Math.round(w*.058)+'px Arial';ctx.fillText(Math.floor(p)+'%',w/2,h*.39);ctx.fillStyle='#aab5af';ctx.font='600 '+Math.round(w*.018)+'px Arial';ctx.fillText('OF '+year+' HAS PASSED',w/2,h*.45);var bw=w*.78,bh=Math.max(34,h*.055),bx=(w-bw)/2,by=h*.54;ctx.fillStyle='rgba(255,255,255,.09)';roundRect(ctx,bx,by,bw,bh,bh/2);var fw=bw*p/100;if(fw>0){var fg=ctx.createLinearGradient(bx,0,bx+bw,0);fg.addColorStop(0,'#00a844');fg.addColorStop(.55,'#00e676');fg.addColorStop(1,'#b9ffd7');ctx.fillStyle=fg;roundRect(ctx,bx,by,fw,bh,bh/2)}ctx.fillStyle='#fff';ctx.font='700 '+Math.round(w*.016)+'px Arial';ctx.fillText((100-p).toFixed(2)+'% REMAINING',w/2,h*.67);ctx.fillStyle='#66716b';ctx.font='500 '+Math.round(w*.013)+'px Arial';ctx.fillText('A 365-DAY JOURNEY · '+selectedDuration+' SECOND TIME-LAPSE',w/2,h*.78);ctx.fillStyle='#9aa69f';ctx.font='600 '+Math.round(w*.014)+'px Arial';ctx.fillText('LAXMAN NEPAL',w/2,h*.88);exportProgressFill.style.width=(ratio*100).toFixed(1)+'%';exportStatus.textContent='Rendering '+Math.round(ratio*100)+'% · '+selectedDuration+'s cinematic time-lapse';if(ratio>=1){rec.stop();return}raf=requestAnimationFrame(draw)}function roundRect(c,x,y,ww,hh,r){var rr=Math.min(r,ww/2,hh/2);c.beginPath();c.moveTo(x+rr,y);c.arcTo(x+ww,y,x+ww,y+hh,rr);c.arcTo(x+ww,y+hh,x,y+hh,rr);c.arcTo(x,y+hh,x,y,rr);c.arcTo(x,y,x+ww,y,rr);c.closePath();c.fill()}function cleanup(){cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}}function cancel(){if(!exporting)return;exporting=false;cancelAnimationFrame(raf);try{if(rec&&rec.state!=='inactive')rec.stop()}catch(e){}if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}cancelExport.hidden=true;exportLandscape.disabled=false;exportPortrait.disabled=false;document.querySelectorAll('.choice').forEach(function(b){b.disabled=false});exportProgress.style.display='none';exportStatus.textContent='Export cancelled.';rec=null}cancelExport.onclick=cancel;exportLandscape.onclick=function(){startExport('landscape')};exportPortrait.onclick=function(){startExport('portrait')};function finishExport(err){if(!exporting)return;exporting=false;cleanup();try{if(rec&&rec.state!=='inactive')rec.stop()}catch(e){}rec=null;cancelExport.hidden=true;exportLandscape.disabled=false;exportPortrait.disabled=false;document.querySelectorAll('.choice').forEach(function(b){b.disabled=false});exportProgress.style.display='none';exportStatus.textContent=err?'Video export failed. Try again or use a desktop browser.':''}update();setInterval(update,1000)})();document.getElementById('copyLink')?.addEventListener('click',async function(){try{await navigator.clipboard.writeText(location.href);this.textContent='✓ COPIED';setTimeout(()=>this.textContent='🔗 COPY LINK',1600)}catch(e){prompt('Copy this link:',location.href)}});document.getElementById('sharePage')?.addEventListener('click',async function(){if(navigator.share){try{await navigator.share({title:document.title,text:'See the live progress of this year',url:location.href})}catch(e){}}else document.getElementById('copyLink').click()});document.getElementById('shareCard')?.addEventListener('click',function(){var now=new Date(),y=now.getFullYear(),s=new Date(y,0,1),e=new Date(y+1,0,1),p=Math.max(0,Math.min(100,(now-s)/(e-s)*100));var format=document.getElementById('cardFormat').value,cv=document.createElement('canvas'),sizes={instagram:[1080,1350],story:[1080,1920],facebook:[H*.89,630],youtube:[H*.89,900]}[format];cv.width=sizes[0];cv.height=sizes[1];var W=cv.width,H=cv.height;var x=cv.getContext('2d'),g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#06150d');g.addColorStop(1,'#10291b');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='rgba(105,240,174,.18)';x.beginPath();x.arc(W*.83,H*.09,Math.min(W,H)*.24,0,Math.PI*2);x.fill();x.textAlign='center';x.fillStyle='#69f0ae';x.font='700 38px Arial';x.fillText('LIVE YEAR TRACKER',W/2,220);x.fillStyle='#fff';x.font='800 120px Arial';x.fillText(Math.floor(p)+'%',W/2,430);x.font='700 56px Arial';x.fillText('OF '+y+' HAS PASSED',W/2,510);var bx=W*.11,by=H*.48,bw=W*.78,bh=Math.max(52,H*.056);x.fillStyle='rgba(255,255,255,.12)';x.roundRect?x.roundRect(bx,by,bw,bh,38):x.fillRect(bx,by,bw,bh);x.fill();x.fillStyle='#00e676';var fw=bw*p/100;x.beginPath();if(x.roundRect)x.roundRect(bx,by,fw,bh,38);else x.rect(bx,by,fw,bh);x.fill();x.fillStyle='#b8c5bd';x.font='500 42px Arial';x.fillText((100-p).toFixed(2)+'% remaining',W/2,840);x.fillStyle='#77857d';x.font='500 32px Arial';x.fillText(now.toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'}),W/2,920);x.fillStyle='#9eaca4';x.font='500 28px Arial';x.fillText('Progress Bar Of the Year • Laxman Nepal',W/2,H*.89);var a=document.createElement('a');a.download='year-progress-'+y+'-share-card.png';a.href=cv.toDataURL('image/png');a.click()});</script></body></html>
