<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050607"><title>Progress Bar of the Year</title>
<style>
:root{--bg:#050607;--text:#f2f4f6;--muted:#8f969d;--track:#393b3d;--accent:#00c853}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;text-align:center}main{width:min(920px,calc(100% - 40px));padding:40px 0}.top-cylinder{width:min(760px,94vw);min-height:78px;margin:0 auto 42px;padding:20px 36px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.035) 48%,rgba(0,200,83,.08));box-shadow:inset 0 1px rgba(255,255,255,.2),inset 0 -14px 32px rgba(0,0,0,.2),0 18px 55px rgba(0,0,0,.38);backdrop-filter:blur(24px);cursor:pointer}.top-cylinder:active{transform:scale(.985)}.top-cylinder span{font-size:clamp(.95rem,2.2vw,1.35rem);font-weight:700;letter-spacing:.045em}.hero{margin-bottom:42px}.headline{margin:0;font-size:clamp(2.15rem,7vw,5.7rem);line-height:1.04;font-weight:800}.subline{margin:14px 0;color:var(--muted);font-size:clamp(1rem,2.2vw,1.5rem)}.label{display:flex;justify-content:center;gap:12px;margin-bottom:10px;color:var(--muted);font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.value{color:var(--text);font-size:clamp(1.2rem,3vw,2rem)}.bar{height:clamp(60px,10vw,92px);background:var(--track);border-radius:24px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#00c853,#00ad49);box-shadow:0 0 28px rgba(0,200,83,.28)}.sound{position:fixed;top:18px;right:18px;width:46px;height:46px;border:1px solid rgba(255,255,255,.12);border-radius:50%;background:#141719;color:#fff;font-size:1.15rem;cursor:pointer}.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:20px;background:rgba(0,0,0,.82);backdrop-filter:blur(12px)}.modal.show{display:grid}.modal-card{width:min(760px,100%);background:#111416;border:1px solid rgba(255,255,255,.13);border-radius:28px;padding:18px;box-shadow:0 30px 100px #000}.modal-head{display:flex;justify-content:space-between;align-items:center;margin:0 4px 14px}.close{background:none;border:0;color:#fff;font-size:28px;cursor:pointer}.modal video{width:100%;display:block;border-radius:18px;background:#050607}.actions{display:flex;justify-content:center;gap:12px;margin-top:16px}.download{padding:13px 22px;border:0;border-radius:999px;background:#00c853;color:#031007;font-weight:800;text-decoration:none}.status{color:var(--muted);font-size:.9rem}
@media(max-width:560px){main{width:calc(100% - 32px)}.top-cylinder{padding:17px 20px;margin-bottom:32px}.top-cylinder span{font-size:.9rem}.bar{border-radius:18px}}
</style></head><body>
<button class="sound" id="sound">🔊</button>
<main>
<div class="top-cylinder" id="videoTrigger"><span>Progress Bar Of the Year By Laxman Nepal</span></div>
<header class="hero"><h1 class="headline"><span id="yearPercent">0</span>% of <span>2026</span> has passed</h1><p class="subline" id="dateText">Loading date…</p></header>
<section><div class="label"><span>Year progress</span><span class="value"><span id="progressValue">0.0</span>%</span></div><div class="bar"><div class="fill" id="progressBar"></div></div></section>
</main>
<div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><strong>Your 10-second Year Progress Video</strong><button class="close" id="close">×</button></div><div id="videoArea"><div class="status">Preparing video with audio…</div></div><div class="actions" id="actions"></div></div></div>
<script>
(()=>{
const $=id=>document.getElementById(id),D=10000;let soundOn=true,ctx=null,master=null,recordDest=null,videoBlob=null,videoURL=null;
function metric(){const n=new Date(),s=new Date(2026,0,1),e=new Date(2027,0,1);return{p:Math.max(0,Math.min(100,(n-s)/(e-s)*100)),date:new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric'}).format(n)}}
function audioInit(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;if(!ctx){ctx=new C();master=ctx.createGain();master.gain.value=1;master.connect(ctx.destination);recordDest=ctx.createMediaStreamDestination();master.connect(recordDest)}ctx.resume();return true}
function makeSound(d){if(!audioInit()||!soundOn)return null;const t=ctx.currentTime+.03,o=ctx.createOscillator(),g=ctx.createGain(),l=ctx.createOscillator(),lg=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(520,t+d/1000);l.frequency.value=2.2;lg.gain.value=35;l.connect(lg);lg.connect(o.frequency);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.22,t+.35);g.gain.setValueAtTime(.22,t+d/1000-.8);g.gain.exponentialRampToValueAtTime(.0001,t+d/1000);o.connect(g);g.connect(master);o.start(t);l.start(t);o.stop(t+d/1000+.1);l.stop(t+d/1000+.1);return true}
function startUI(){const m=metric();$('dateText').textContent=m.date;const st=performance.now();makeSound(D);function f(t){const q=Math.min(1,(t-st)/D),x=1-Math.pow(1-q,4),v=m.p*x;$('yearPercent').textContent=Math.floor(v);$('progressValue').textContent=v.toFixed(1);$('progressBar').style.width=v+'%';if(q<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
function createVideo(){if(!('MediaRecorder'in window))return;const m=metric(),canvas=document.createElement('canvas');canvas.width=1280;canvas.height=720;const c=canvas.getContext('2d');const stream=canvas.captureStream(60);audioInit();recordDest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));let mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm';const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:5000000});const chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{videoBlob=new Blob(chunks,{type:mime});videoURL=URL.createObjectURL(videoBlob);showReady()};rec.start();const st=performance.now();makeSound(D);function draw(t){const q=Math.min(1,(t-st)/D),x=1-Math.pow(1-q,4),v=m.p*x;c.fillStyle='#050607';c.fillRect(0,0,1280,720);c.fillStyle='rgba(255,255,255,.08)';c.beginPath();c.roundRect(230,70,820,80,40);c.fill();c.fillStyle='#fff';c.font='700 28px system-ui';c.textAlign='center';c.fillText('Progress Bar Of the Year By Laxman Nepal',640,120);c.font='800 96px system-ui';c.fillText(Math.floor(v)+'% of 2026 has passed',640,300);c.fillStyle='#92989e';c.font='32px system-ui';c.fillText(m.date,640,355);c.fillStyle='#393b3d';c.beginPath();c.roundRect(120,480,1040,90,45);c.fill();c.fillStyle='#00c853';c.beginPath();c.roundRect(120,480,1040*(v/100),90,45);c.fill();c.fillStyle='#fff';c.font='700 26px system-ui';c.fillText('YEAR PROGRESS  '+v.toFixed(1)+'%',640,450);if(q<1)requestAnimationFrame(draw);else setTimeout(()=>rec.stop(),150)}requestAnimationFrame(draw)}
function showReady(){if(!$('modal').classList.contains('show'))return;const area=$('videoArea');area.innerHTML='';const v=document.createElement('video');v.src=videoURL;v.controls=true;v.autoplay=true;area.appendChild(v);$('actions').innerHTML='<a class="download" href="'+videoURL+'" download="progress-bar-of-the-year-2026.webm">Download Video</a>'}
$('videoTrigger').onclick=()=>{$('modal').classList.add('show');if(videoURL)showReady()};$('close').onclick=()=>{$('modal').classList.remove('show')};$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊':'🔇'};startUI();createVideo();
})();
</script></body></html>
