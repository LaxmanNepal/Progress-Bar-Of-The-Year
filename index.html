<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050607"><meta name="description" content="Live year progress bar showing how much of the current year has passed."><title>Progress Bar Of the Year | Laxman Nepal</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#050607;color:#fff}body{display:flex;align-items:center;justify-content:center;padding:20px}main{width:min(900px,100%);text-align:center}.card{padding:28px 18px;border-radius:24px;background:#101315;border:1px solid #292d30;box-shadow:0 20px 60px rgba(0,0,0,.35)}h1{font-size:clamp(2rem,9vw,5rem);margin:20px 0;line-height:1.05}p{font-size:clamp(1rem,4vw,1.5rem);color:#aab0b5}.label{display:flex;justify-content:space-between;gap:12px;margin:35px 0 10px;color:#c9ced2;font-weight:bold}.bar{height:70px;width:100%;background:#34383b;border-radius:18px;overflow:hidden;box-shadow:inset 0 0 12px #000}.fill{height:100%;width:0%;background:linear-gradient(90deg,#00c853,#69f0ae,#00c853);background-size:200% 100%;border-radius:18px;position:relative;transition:width 2.5s cubic-bezier(.22,1,.36,1);animation:shine 2.2s linear infinite}.fill:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:sweep 1.8s infinite}.fill:before{content:"";position:absolute;right:0;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 18px 5px rgba(105,240,174,.8);transform:translate(50%,-50%);animation:pulse 1.4s ease-in-out infinite}@keyframes shine{to{background-position:-200% 0}}@keyframes sweep{to{transform:translateX(100%)}}@keyframes pulse{50%{opacity:.55;box-shadow:0 0 28px 8px rgba(105,240,174,.95)}}.value{font-size:1.3rem;font-weight:bold}.remaining{margin-top:20px;font-size:1rem;color:#8f979d}.remaining strong{color:#fff}small{display:block;margin-top:30px;color:#80878d}@media(prefers-reduced-motion:reduce){.fill{animation:none;transition:none}.fill:after,.fill:before{animation:none}}</style></head><body><main><div class="card"><h1><span id="yearPercent">0</span>% of <span id="currentYear">2026</span> has passed</h1><p id="dateText">Loading date...</p><div class="label"><span>YEAR PROGRESS</span><span class="value"><span id="progressValue">0.0</span>%</span></div><div class="bar" aria-label="Year progress"><div class="fill" id="progressBar"></div></div><div class="remaining" id="remainingText">Calculating remaining time…</div><small>Progress Bar Of the Year By Laxman Nepal</small></div></main><script>(function(){var bar=document.getElementById('progressBar'),whole=document.getElementById('yearPercent'),value=document.getElementById('progressValue'),remaining=document.getElementById('remainingText');function animateNumber(from,to,duration){var start=performance.now();function frame(now){var t=Math.min(1,(now-start)/duration),e=1-Math.pow(1-t,3),n=from+(to-from)*e;whole.textContent=Math.floor(n);value.textContent=n.toFixed(1);if(t<1)requestAnimationFrame(frame)}requestAnimationFrame(frame)}function update(){var now=new Date(),year=now.getFullYear(),start=new Date(year,0,1),end=new Date(year+1,0,1),p=((now-start)/(end-start))*100;p=Math.max(0,Math.min(100,p));document.getElementById('currentYear').textContent=year;document.getElementById('dateText').textContent=now.toLocaleString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});bar.style.width='0%';animateNumber(0,p,2500);requestAnimationFrame(function(){requestAnimationFrame(function(){bar.style.width=p+'%';});});var ms=Math.max(0,end-now),days=Math.floor(ms/86400000),hours=Math.floor(ms/3600000)%24,minutes=Math.floor(ms/60000)%60;remaining.innerHTML='<strong>'+days+' days '+hours+' hours '+minutes+' minutes</strong> remaining in '+year;}update();setInterval(update,60000);})();</script></body></html>
