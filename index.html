<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050607"><title>Progress Bar of the Year</title><style>
:root{--bg:#050607;--text:#f2f4f6;--muted:#8f969d;--track:#393b3d;--accent:#00c853}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;text-align:center}main{width:min(920px,calc(100% - 40px));padding:40px 0}.top-cylinder{width:min(760px,94vw);min-height:78px;margin:0 auto 42px;padding:20px 36px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.035) 48%,rgba(0,200,83,.08));box-shadow:inset 0 1px rgba(255,255,255,.2),inset 0 -14px 32px rgba(0,0,0,.2),0 18px 55px rgba(0,0,0,.38);backdrop-filter:blur(24px);cursor:pointer}.top-cylinder span{font-size:clamp(.95rem,2.2vw,1.35rem);font-weight:700}.hero{margin-bottom:42px}.headline{margin:0;font-size:clamp(2.15rem,7vw,5.7rem);line-height:1.04;font-weight:800}.subline{margin:14px 0;color:var(--muted);font-size:clamp(1rem,2.2vw,1.5rem)}.label{display:flex;justify-content:center;gap:12px;margin-bottom:10px;color:var(--muted);font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.value{color:var(--text);font-size:clamp(1.2rem,3vw,2rem)}.bar{height:clamp(60px,10vw,92px);background:var(--track);border-radius:24px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#00c853,#00ad49)}.sound{position:fixed;top:18px;right:18px;width:46px;height:46px;border:1px solid rgba(255,255,255,.12);border-radius:50%;background:#141719;color:#fff;font-size:1.15rem}.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:20px;background:rgba(0,0,0,.82);backdrop-filter:blur(12px)}.modal.show{display:grid}.modal-card{width:min(820px,100%);max-height:95vh;overflow:auto;background:#111416;border:1px solid rgba(255,255,255,.13);border-radius:28px;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin:0 4px 14px}.close{background:none;border:0;color:#fff;font-size:28px}.format-switch{display:flex;justify-content:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.format-switch button{padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:#1b2023;color:#fff;font-weight:700}.format-switch button.active{background:#00c853;color:#031007}.modal video{width:100%;max-height:68vh;display:block;object-fit:contain;border-radius:18px;background:#050607}.actions{display:flex;justify-content:center;gap:12px;margin-top:16px}.download{padding:13px 22px;border-radius:999px;background:#00c853;color:#031007;font-weight:800;text-decoration:none}.status{color:var(--muted)}@media(max-width:560px){main{width:calc(100% - 32px)}.top-cylinder{padding:17px 20px;margin-bottom:32px}.top-cylinder span{font-size:.9rem}}
</style></head><body><button class="sound" id="sound">🔊</button><main><div class="top-cylinder" id="videoTrigger"><span>Progress Bar Of the Year By Laxman Nepal</span></div><header class="hero"><h1 class="headline"><span id="yearPercent">0</span>% of <span>2026</span> has passed</h1><p class="subline" id="dateText">Loading date…</p></header><section><div class="label"><span>Year progress</span><span class="value"><span id="progressValue">0.0</span>%</span></div><div class="bar"><div class="fill" id="progressBar"></div></div></section></main><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><strong>1080p 60 FPS Year Progress Video</strong><button class="close" id="close">×</button></div><div class="format-switch"><button data-format="16:9" class="active">16:9 1080p</button><button data-format="9:16">9:16 1080p</button></div><div id="videoArea"><div class="status">Preparing smooth 1080p 60 FPS videos…</div></div><div class="actions" id="actions"></div></div></div><script>
(()=>{const $=id=>document.getElementById(id),D=10000,FPS=60,FRAMES=D/1000*FPS;let soundOn=true,ctx,master,recordDest,videos={},selected="16:9";
function metric(){const n=new Date(),s=new Date(2026,0,1),e=new Date(2027,0,1);return{p:Math.max(0,Math.min(100,(n-s)/(e-s)*100)),date:new Intl.DateTimeFormat("en-US",{month:"long",day:"numeric"}).format(n)}}
function audioInit(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;if(!ctx){ctx=new C();master=ctx.createGain();master.gain.value=1;master.connect(ctx.destination);recordDest=ctx.createMediaStreamDestination();master.connect(recordDest)}return ctx.resume()}
function makeSound(d){if(!audioInit()||!soundOn)return;const t=ctx.currentTime+.03,o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(520,t+d/1000);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.22,t+.3);g.gain.setValueAtTime(.22,t+d/1000-.7);g.gain.exponentialRampToValueAtTime(.0001,t+d/1000);o.connect(g);g.connect(master);o.start(t);o.stop(t+d/1000+.05)}
function ui(){const m=metric(),st=performance.now();$("dateText").textContent=m.date;makeSound(D);function f(t){const q=Math.min(1,(t-st)/D),v=m.p*(1-Math.pow(1-q,4));$("yearPercent").textContent=Math.floor(v);$("progressValue").textContent=v.toFixed(1);$("progressBar").style.width=v+"%";if(q<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
function renderVideo(format){return new Promise(async resolve=>{if(!("MediaRecorder"in window))return resolve();await audioInit();const vertical=format==="9:16",W=vertical?1080:1920,H=vertical?1920:1080,m=metric(),canvas=document.createElement("canvas"),c=canvas.getContext("2d",{alpha:false});canvas.width=W;canvas.height=H;const stream=canvas.captureStream(FPS);recordDest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));const mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")?"video/webm;codecs=vp9,opus":"video/webm",rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:vertical?12000000:16000000}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{videos[format]={url:URL.createObjectURL(new Blob(chunks,{type:mime})),format};resolve()};rec.start(1000);makeSound(D);function rr(x,y,w,h,r,fill){c.fillStyle=fill;c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}function center(txt,y,size,weight=800,color="#fff"){c.fillStyle=color;c.font=weight+" "+size+"px system-ui";c.textAlign="center";c.textBaseline="middle";c.fillText(txt,W/2,y)}let frame=0;function draw(){const q=Math.min(1,frame/FRAMES),ease=1-Math.pow(1-q,4),v=m.p*ease;c.fillStyle="#050607";c.fillRect(0,0,W,H);if(vertical){rr(120,270,W-240,300,150,"rgba(255,255,255,.08)");center("Progress Bar Of the Year",390,76);center("By Laxman Nepal",485,54,600,"#aeb4b8");center(Math.floor(v)+"%",H*.43,330);center("of 2026 has passed",H*.53,82);center(m.date,H*.61,62,500,"#92989e");center("YEAR PROGRESS  "+v.toFixed(1)+"%",H*.72,56);rr(180,H*.77,W-360,220,110,"#393b3d");rr(180,H*.77,(W-360)*v/100,220,110,"#00c853")}else{rr(690,210,W-1380,240,120,"rgba(255,255,255,.08)");center("Progress Bar Of the Year By Laxman Nepal",330,72);center(Math.floor(v)+"% of 2026 has passed",H*.43,210);center(m.date,H*.56,64,500,"#92989e");center("YEAR PROGRESS  "+v.toFixed(1)+"%",H*.69,54);rr(360,H*.75,W-720,210,105,"#393b3d");rr(360,H*.75,(W-720)*v/100,210,105,"#00c853")}frame++;if(frame<=FRAMES)requestAnimationFrame(draw);else setTimeout(()=>rec.stop(),250)}draw()})}
function show(){const x=videos[selected];if(!x)return;const a=$("videoArea");a.innerHTML="";const v=document.createElement("video");v.src=x.url;v.controls=true;v.autoplay=true;v.playsInline=true;a.appendChild(v);$("actions").innerHTML='<a class="download" href="'+x.url+'" download="progress-bar-2026-1080p60-'+selected.replace(":","x")+'.webm">Download 1080p 60 FPS '+selected+' Video</a>'}
document.querySelectorAll("[data-format]").forEach(b=>b.onclick=()=>{selected=b.dataset.format;document.querySelectorAll("[data-format]").forEach(x=>x.classList.toggle("active",x===b));show()});$("videoTrigger").onclick=()=>{$("modal").classList.add("show");show()};$("close").onclick=()=>$("modal").classList.remove("show");$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("show")};$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊":"🔇"};ui();Promise.all([renderVideo("16:9"),renderVideo("9:16")]).then(show)})();
</script></body></html>
