<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050607"><title>Progress Bar Of the Year By Laxman Nepal</title><style>:root{--bg:#050607;--text:#f2f4f6;--muted:#8f969d;--track:#393b3d;--accent:#00c853}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;text-align:center}main{width:min(920px,calc(100% - 40px));padding:40px 0}.top-cylinder{width:min(760px,94vw);min-height:78px;margin:0 auto 42px;padding:20px 36px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.035) 48%,rgba(0,200,83,.08));box-shadow:inset 0 1px rgba(255,255,255,.2),inset 0 -14px 32px rgba(0,0,0,.2),0 18px 55px rgba(0,0,0,.38);backdrop-filter:blur(24px);cursor:pointer}.top-cylinder span{font-size:clamp(.95rem,2.2vw,1.35rem);font-weight:700}.hero{margin-bottom:42px}.headline{margin:0;font-size:clamp(2.15rem,7vw,5.7rem);line-height:1.04;font-weight:800}.subline{margin:14px 0;color:var(--muted);font-size:clamp(1rem,2.2vw,1.5rem)}.label{display:flex;justify-content:center;gap:12px;margin-bottom:10px;color:var(--muted);font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.value{color:var(--text);font-size:clamp(1.2rem,3vw,2rem)}.bar{height:clamp(60px,10vw,92px);background:var(--track);border-radius:24px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#00c853,#00ad49)}.sound{position:fixed;top:18px;right:18px;width:46px;height:46px;border:1px solid rgba(255,255,255,.12);border-radius:50%;background:#141719;color:#fff;font-size:1.15rem}.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:20px;background:rgba(0,0,0,.82);backdrop-filter:blur(12px)}.modal.show{display:grid}.modal-card{width:min(820px,100%);max-height:95vh;overflow:auto;background:#111416;border:1px solid rgba(255,255,255,.13);border-radius:28px;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin:0 4px 14px}.close{background:none;border:0;color:#fff;font-size:28px}.format-switch{display:flex;justify-content:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.format-switch button{padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:#1b2023;color:#fff;font-weight:700}.format-switch button.active{background:#00c853;color:#031007}.modal video{width:100%;max-height:68vh;display:block;object-fit:contain;border-radius:18px;background:#050607}.actions{display:flex;justify-content:center;gap:12px;margin-top:16px}.download{padding:13px 22px;border-radius:999px;background:#00c853;color:#031007;font-weight:800;text-decoration:none}.status{color:var(--muted)}@media(max-width:560px){main{width:calc(100% - 32px)}.top-cylinder{padding:17px 20px;margin-bottom:32px}.top-cylinder span{font-size:.9rem}}</style></head><body><button class="sound" id="sound" aria-label="Toggle sound">🔊</button><main><div class="top-cylinder" id="videoTrigger"><span>Progress Bar Of the Year By Laxman Nepal</span></div><header class="hero"><h1 class="headline"><span id="yearPercent">0</span>% of <span>2026</span> has passed</h1><p class="subline" id="dateText">Loading date…</p></header><section><div class="label"><span>Year progress</span><span class="value"><span id="progressValue">0.0</span>%</span></div><div class="bar"><div class="fill" id="progressBar"></div></div></section></main><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><strong>1080p 30 FPS Year Progress Video</strong><button class="close" id="close">×</button></div><div class="format-switch"><button data-format="16:9" class="active">16:9 1080p</button><button data-format="9:16">9:16 1080p</button></div><div id="videoArea"><div class="status">Preparing synchronized videos…</div></div><div class="actions" id="actions"></div></div></div><script>
(()=>{const $=id=>document.getElementById(id),D=10000,FPS=30,FRAME_MS=1000/FPS,TOTAL_FRAMES=Math.round(D/FRAME_MS);let soundOn=true,uiCtx=null,uiMaster=null,videos={},selected="16:9",animationStart=0,animationRunning=false;
function metric(){const n=new Date(),s=new Date(2026,0,1),e=new Date(2027,0,1);return{p:Math.max(0,Math.min(100,(n-s)/(e-s)*100)),date:new Intl.DateTimeFormat("en-US",{month:"long",day:"numeric"}).format(n)}}
function ease(q){q=Math.max(0,Math.min(1,q));return 1-Math.pow(1-q,4)}
function drawSiteValue(v){$("yearPercent").textContent=Math.floor(v);$("progressValue").textContent=v.toFixed(1);$("progressBar").style.width=v+"%"}
function uiAudioInit(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;if(!uiCtx){uiCtx=new C();uiMaster=uiCtx.createGain();uiMaster.gain.value=1;uiMaster.connect(uiCtx.destination)}return true}
function startAudio(ctx,dest,duration=D){const t=ctx.currentTime+.015,stop=t+duration/1000,out=ctx.createGain();out.gain.setValueAtTime(1,t);out.gain.setValueAtTime(1,t+duration/1000-.12);out.gain.exponentialRampToValueAtTime(.0001,stop);out.connect(dest);const o=ctx.createOscillator(),g=ctx.createGain();o.type="triangle";o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(600,stop);g.gain.setValueAtTime(.13,t);g.gain.setValueAtTime(.13,stop-.03);g.gain.exponentialRampToValueAtTime(.0001,stop);o.connect(g).connect(out);o.start(t);o.stop(stop+.005);return{start:t,stop}}
function startOpening(){const m=metric(),start=performance.now();animationStart=start;animationRunning=true;$("dateText").textContent=m.date;if(soundOn&&uiAudioInit()){uiCtx.resume();startAudio(uiCtx,uiMaster,D)}function frame(now){const elapsed=Math.min(D,Math.max(0,now-start)),v=m.p*ease(elapsed/D);drawSiteValue(v);if(elapsed<D){requestAnimationFrame(frame)}else{drawSiteValue(m.p);animationRunning=false}}requestAnimationFrame(frame)}
function rounded(c,x,y,w,h,r,fill){c.fillStyle=fill;c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function text(c,W,txt,y,size,weight=800,color="#fff"){c.fillStyle=color;c.font=weight+" "+size+"px system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;c.textAlign="center";c.textBaseline="middle";c.fillText(txt,W/2,y)}
function drawVideoFrame(c,W,H,v,m,vertical){c.fillStyle="#050607";c.fillRect(0,0,W,H);if(vertical){const s=W/1080;rounded(c,70*s,110*s,940*s,250*s,125*s,"rgba(255,255,255,.08)");text(c,W,"Progress Bar Of the Year",190*s,62*s);text(c,W,"By Laxman Nepal",265*s,44*s,600,"#aeb4b8");text(c,W,Math.floor(v)+"%",.40*H,270*s);text(c,W,"of 2026 has passed",.49*H,70*s);text(c,W,m.date,.57*H,52*s,500,"#92989e");text(c,W,"YEAR PROGRESS  "+v.toFixed(1)+"%",.68*H,48*s);rounded(c,0,.73*H,W,.14*H,0,"#393b3d");rounded(c,0,.73*H,W*v/100,.14*H,0,"#00c853")}else{const s=W/1920;text(c,W,"Progress Bar Of the Year By Laxman Nepal",72*s,50*s);text(c,W,Math.floor(v)+"% of 2026 has passed",.40*H,135*s);text(c,W,m.date,.53*H,46*s,500,"#92989e");text(c,W,"YEAR PROGRESS  "+v.toFixed(1)+"%",.64*H,42*s);rounded(c,0,.70*H,W,.18*H,0,"#393b3d");rounded(c,0,.70*H,W*v/100,.18*H,0,"#00c853")}}
function renderVideo(format){return new Promise(async resolve=>{if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)return resolve();const C=window.AudioContext||window.webkitAudioContext;if(!C)return resolve();const ctx=new C(),master=ctx.createGain(),dest=ctx.createMediaStreamDestination();master.gain.value=1;master.connect(dest);await ctx.resume();const vertical=format==="9:16",W=vertical?1080:1920,H=vertical?1920:1080,m=metric(),canvas=document.createElement("canvas"),c=canvas.getContext("2d",{alpha:false,desynchronized:false});canvas.width=W;canvas.height=H;const stream=canvas.captureStream(FPS);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));const mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")?"video/webm;codecs=vp9,opus":"video/webm",rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:format==="9:16"?12000000:16000000});let chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{videos[format]={url:URL.createObjectURL(new Blob(chunks,{type:mime})),format};ctx.close();resolve()};const audio=startAudio(ctx,master,D);rec.start(250);const start=performance.now();let frame=0;function render(){const elapsed=Math.min(D,Math.max(0,performance.now()-start)),v=m.p*ease(elapsed/D);drawVideoFrame(c,W,H,v,m,vertical);frame++;if(elapsed<D){requestAnimationFrame(render)}else{const finalV=m.p;drawVideoFrame(c,W,H,finalV,m,vertical);const remaining=Math.max(0,audio.stop-ctx.currentTime);setTimeout(()=>{try{rec.stop()}catch{}},Math.max(0,remaining*1000))}}render()})}
function show(){const x=videos[selected];if(!x)return;const a=$("videoArea");a.innerHTML="";const v=document.createElement("video");v.src=x.url;v.controls=true;v.autoplay=true;v.playsInline=true;a.appendChild(v);$("actions").innerHTML='<a class="download" href="'+x.url+'" download="progress-bar-2026-1080p30-'+selected.replace(":","x")+'.webm">Download 1080p 30 FPS '+selected+' Video</a>'}
document.querySelectorAll("[data-format]").forEach(b=>b.onclick=()=>{selected=b.dataset.format;document.querySelectorAll("[data-format]").forEach(x=>x.classList.toggle("active",x===b));show()});$("videoTrigger").onclick=()=>{$("modal").classList.add("show");show()};$("close").onclick=()=>$("modal").classList.remove("show");$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("show")};$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊":"🔇";if(soundOn&&!animationRunning)startOpening()};$("dateText").textContent=metric().date;drawSiteValue(0);startOpening();Promise.all([renderVideo("16:9"),renderVideo("9:16")]).then(show)})();</script></body></html>
