<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b0a"><meta name="description" content="Live year progress dashboard showing how much of the current year has passed, with optional 1080p video export."><title>Progress Bar Of the Year | Laxman Nepal</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#050806;color:#fff}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;overflow-x:hidden}body:before,body:after{content:"";position:fixed;width:38vw;height:38vw;border-radius:50%;filter:blur(70px);opacity:.18;pointer-events:none;background:#00c853}body:before{top:-15vw;left:-12vw}body:after{right:-15vw;bottom:-15vw;background:#69f0ae}main{width:min(920px,100%);position:relative;z-index:1}.card{padding:clamp(22px,5vw,46px);border:1px solid rgba(255,255,255,.12);border-radius:32px;background:rgba(16,21,18,.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 30px 100px rgba(0,0,0,.5)}.brand{display:flex;align-items:center;justify-content:center;gap:9px;color:#8e9b94;font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.dot{width:8px;height:8px;border-radius:50%;background:#00e676;box-shadow:0 0 14px #00e676;animation:blink 1.6s infinite}h1{font-size:clamp(2.25rem,9vw,5.7rem);letter-spacing:-.055em;line-height:.98;margin:22px auto 14px;max-width:850px}h1 .accent{background:linear-gradient(120deg,#fff,#69f0ae);-webkit-background-clip:text;background-clip:text;color:transparent}p{font-size:clamp(.95rem,3.5vw,1.2rem);color:#9fa9a4;margin:0}.label{display:flex;justify-content:space-between;gap:12px;margin:42px 0 11px;color:#aab5af;font-size:.78rem;letter-spacing:.12em;font-weight:800}.value{color:#fff;font-size:1rem;letter-spacing:0}.bar{height:76px;width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);border-radius:22px;overflow:hidden;box-shadow:inset 0 2px 14px rgba(0,0,0,.5)}.fill{height:100%;width:0%;background:linear-gradient(90deg,#00a844,#00e676,#b9ffd7,#00c853);background-size:220% 100%;border-radius:20px;position:relative;transition:width 1s linear;animation:shine 2.8s linear infinite}.fill:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-100%);animation:sweep 2.2s infinite}.fill:before{content:"";position:absolute;right:0;top:50%;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 20px 6px rgba(105,240,174,.95);transform:translate(50%,-50%);animation:pulse 1.5s ease-in-out infinite}.remaining{margin-top:19px;color:#89948e;font-size:.92rem}.remaining strong{color:#fff;font-variant-numeric:tabular-nums}.controls{display:flex;justify-content:center;gap:9px;margin-top:25px;flex-wrap:wrap}.controls button,.export button{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#cbd3cf;border-radius:14px;padding:10px 18px;font-weight:800;cursor:pointer;transition:.2s}.controls button:hover,.export button:hover{transform:translateY(-1px);background:rgba(255,255,255,.1)}.controls button.active{background:#00c853;color:#001b0b;border-color:#00c853;box-shadow:0 0 24px rgba(0,200,83,.2)}.extra{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.stat{padding:17px 10px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}.stat b{display:block;font-size:clamp(1.05rem,4vw,1.45rem);font-variant-numeric:tabular-nums}.stat span{display:block;margin-top:6px;color:#77837c;font-size:.7rem;font-weight:800;letter-spacing:.08em}.export{margin-top:18px;padding:18px;border-radius:20px;background:rgba(0,200,83,.055);border:1px solid rgba(105,240,174,.12)}.export h2{font-size:.9rem;margin:0 0 6px;letter-spacing:.1em}.export p{font-size:.78rem;color:#78847d;margin:0 0 13px}.export-actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.export button{font-size:.78rem;padding:10px 14px}.export button.primary{background:#00c853;color:#001b0b;border-color:#00c853}.export-status{min-height:18px;margin-top:10px;color:#9fa9a4;font-size:.72rem}.export-progress{height:5px;margin-top:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;display:none}.export-progress i{display:block;height:100%;width:0;background:#69f0ae;transition:width .1s linear}footer{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:28px;color:#66716b;font-size:.75rem}footer a{color:#9aa69f;text-decoration:none}footer a:hover{color:#69f0ae}@keyframes shine{to{background-position:-220% 0}}@keyframes sweep{to{transform:translateX(100%)}}@keyframes pulse{50%{opacity:.55;box-shadow:0 0 30px 9px rgba(105,240,174,.95)}}@keyframes blink{50%{opacity:.3;transform:scale(.75)}}@media(max-width:600px){body{padding:12px}.card{border-radius:25px;padding:25px 16px}.bar{height:58px;border-radius:17px}.fill{border-radius:15px}.extra{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.label{margin-top:32px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(prefers-color-scheme:light){body{background:#edf3ef;color:#102017}.card{background:rgba(255,255,255,.72);border-color:rgba(0,0,0,.08)}h1{color:#102017}.stat{background:rgba(0,0,0,.035);border-color:rgba(0,0,0,.06)}.remaining strong,.value{color:#102017}.controls button,.export button{color:#304038}.export{background:rgba(0,150,60,.04);border-color:rgba(0,120,60,.12)}}@media(max-width:420px){.export-actions{display:grid;grid-template-columns:1fr 1fr}.export button{width:100%}}</style></head><body><main><section class="card"><div class="brand"><span class="dot"></span>Live Year Tracker</div><h1><span id="yearPercent">0</span>% of <span class="accent" id="currentYear">2026</span> has passed</h1><p id="dateText">Loading date...</p><div class="label"><span>YEAR PROGRESS</span><span class="value"><span id="progressValue">0.0000</span>%</span></div><div class="bar" role="progressbar" aria-label="Year progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="progressBar"></div></div><div class="remaining" id="remainingText">Calculating remaining time…</div><div class="controls"><button id="liveBtn" class="active" type="button">● LIVE</button><button id="pauseBtn" type="button">Ⅱ PAUSE</button></div><div class="extra"><div class="stat"><b id="daysPassed">0</b><span>DAYS PASSED</span></div><div class="stat"><b id="daysLeft">0</b><span>DAYS LEFT</span></div><div class="stat"><b id="secondsLeft">0</b><span>SECONDS LEFT</span></div></div><section class="export" aria-label="Video export"><h2>1080p VIDEO EXPORT</h2><p>Optional on-demand time-lapse. Nothing is rendered until you tap a button.</p><div class="export-actions"><button class="primary" id="exportLandscape" type="button">▶ 16:9 · 1080p</button><button id="exportPortrait" type="button">▶ 9:16 · 1080p</button><button id="cancelExport" type="button" hidden>✕ CANCEL</button></div><div class="export-progress" id="exportProgress"><i id="exportProgressFill"></i></div><div class="export-status" id="exportStatus" aria-live="polite"></div></section><footer>Progress Bar Of the Year <span>•</span> <a href="https://www.laxmannepal.com.np" rel="noopener">Laxman Nepal</a></footer></section></main><script>(function(){var bar=document.getElementById('progressBar'),whole=document.getElementById('yearPercent'),value=document.getElementById('progressValue'),remaining=document.getElementById('remainingText'),dateText=document.getElementById('dateText'),daysPassed=document.getElementById('daysPassed'),daysLeft=document.getElementById('daysLeft'),secondsLeft=document.getElementById('secondsLeft'),liveBtn=document.getElementById('liveBtn'),pauseBtn=document.getElementById('pauseBtn'),exportLandscape=document.getElementById('exportLandscape'),exportPortrait=document.getElementById('exportPortrait'),cancelExport=document.getElementById('cancelExport'),exportStatus=document.getElementById('exportStatus'),exportProgress=document.getElementById('exportProgress'),exportProgressFill=document.getElementById('exportProgressFill');var running=true,lastYear=0;function getProgress(now){var year=now.getFullYear(),start=new Date(year,0,1),end=new Date(year+1,0,1);return {year:year,start:start,end:end,p:Math.max(0,Math.min(100,(now-start)/(end-start)*100)),ms:end-now}}function update(){if(!running)return;var now=new Date(),d=getProgress(now),p=d.p;document.getElementById('currentYear').textContent=d.year;dateText.textContent=now.toLocaleString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'});bar.style.width=p+'%';bar.parentElement.setAttribute('aria-valuenow',p.toFixed(4));whole.textContent=Math.floor(p);value.textContent=p.toFixed(4);var passedMs=now-d.start,dp=Math.floor(passedMs/86400000),dl=Math.ceil(d.ms/86400000),sl=Math.floor(d.ms/1000);daysPassed.textContent=dp;daysLeft.textContent=dl;secondsLeft.textContent=sl.toLocaleString();remaining.innerHTML='<strong>'+Math.floor(d.ms/86400000)+'d '+Math.floor(d.ms/3600000)%24+'h '+Math.floor(d.ms/60000)%60+'m '+Math.floor(d.ms/1000)%60+'s</strong> remaining in '+d.year;if(d.year!==lastYear){lastYear=d.year;bar.style.width='0%';requestAnimationFrame(function(){bar.style.width=p+'%'})}}function setRunning(v){running=v;liveBtn.classList.toggle('active',v);pauseBtn.classList.toggle('active',!v);if(v)update()}liveBtn.onclick=function(){setRunning(true)};pauseBtn.onclick=function(){setRunning(false)};var exporting=false,raf=0;function pickMime(){var types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];for(var i=0;i<types.length;i++)if(window.MediaRecorder&&MediaRecorder.isTypeSupported(types[i]))return types[i];return ''}function startExport(orientation){if(exporting)return;if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){exportStatus.textContent='This browser does not support in-browser video export.';return}var mime=pickMime();if(!mime){exportStatus.textContent='No supported WebM video encoder was found.';return}exporting=true;exportLandscape.disabled=true;exportPortrait.disabled=true;cancelExport.hidden=false;exportProgress.style.display='block';exportProgressFill.style.width='0%';exportStatus.textContent='Preparing 1080p '+(orientation==='landscape'?'16:9':'9:16')+' export…';var w=orientation==='landscape'?1920:1080,h=orientation==='landscape'?1080:1920,canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;var ctx=canvas.getContext('2d'),stream=canvas.captureStream(30),chunks=[],rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12000000}),duration=30000,start=performance.now();rec.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};rec.onerror=function(){finishExport(true)};rec.onstop=function(){if(!exporting){cleanup();return}var blob=new Blob(chunks,{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a'),name='progress-bar-'+new Date().getFullYear()+'-'+(orientation==='landscape'?'1080p-16x9':'1080p-9x16')+'.webm';a.href=url;a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000);exportStatus.textContent='Export complete — your 1080p WebM video is ready.';exporting=false;cancelExport.hidden=true;exportLandscape.disabled=false;exportPortrait.disabled=false;exportProgressFill.style.width='100%';setTimeout(function(){exportProgress.style.display='none'},1800);cleanup()};function draw(t){if(!exporting)return;var elapsed=t-start,ratio=Math.min(1,elapsed/duration),d=getProgress(new Date()),p=ratio*100;ctx.clearRect(0,0,w,h);var g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#07110b');g.addColorStop(1,'#102018');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.fillStyle='#8e9b94';ctx.font='800 '+Math.round(w*.022)+'px Arial';ctx.textAlign='center';ctx.fillText('LIVE YEAR TRACKER',w/2,h*.18);ctx.fillStyle='#fff';ctx.font='800 '+Math.round(w*.058)+'px Arial';ctx.fillText(Math.floor(p)+'% OF '+d.year+' HAS PASSED',w/2,h*.34);var bw=w*.78,bh=Math.max(38,h*.065),bx=(w-bw)/2,by=h*.5;ctx.fillStyle='rgba(255,255,255,.09)';roundRect(ctx,bx,by,bw,bh,bh/2);var fw=bw*p/100;ctx.fillStyle='#00e676';roundRect(ctx,bx,by,fw,bh,bh/2);ctx.fillStyle='#aab5af';ctx.font='600 '+Math.round(w*.018)+'px Arial';ctx.fillText((100-p).toFixed(2)+'% remaining in '+d.year,w/2,h*.68);ctx.fillStyle='#66716b';ctx.font='500 '+Math.round(w*.014)+'px Arial';ctx.fillText('Progress Bar Of the Year • Laxman Nepal',w/2,h*.84);exportProgressFill.style.width=(ratio*100).toFixed(1)+'%';exportStatus.textContent='Rendering '+Math.round(ratio*100)+'% · 30-second time-lapse';if(ratio>=1){rec.stop();return}raf=requestAnimationFrame(draw)}function roundRect(c,x,y,ww,hh,r){var rr=Math.min(r,ww/2,hh/2);c.beginPath();c.moveTo(x+rr,y);c.arcTo(x+ww,y,x+ww,y+hh,rr);c.arcTo(x+ww,y+hh,x,y+hh,rr);c.arcTo(x,y+hh,x,y,rr);c.arcTo(x,y,x+ww,y,rr);c.closePath();c.fill()}function cleanup(){cancelAnimationFrame(raf);stream.getTracks().forEach(function(t){t.stop()})}cancelExport.onclick=function(){if(!exporting)return;exporting=false;cancelAnimationFrame(raf);try{rec.stop()}catch(e){}cleanup();exportStatus.textContent='Export cancelled.';cancelExport.hidden=true;exportLandscape.disabled=false;exportPortrait.disabled=false;exportProgress.style.display='none'}function finishExport(err){if(!exporting)return;exporting=false;cleanup();cancelExport.hidden=true;exportLandscape.disabled=false;exportPortrait.disabled=false;exportProgress.style.display='none';exportStatus.textContent=err?'Video export failed. Try again or use a desktop browser.':''}exportLandscape.onclick=function(){startExport('landscape')};exportPortrait.onclick=function(){startExport('portrait')};update();setInterval(update,1000)})();</script></body></html
