<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050607"><title>Progress Bar Of the Year By Laxman Nepal</title><style>:root{--bg:#050607;--text:#f2f4f6;--muted:#8f969d;--track:#393b3d;--accent:#00c853}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;text-align:center}main{width:min(920px,calc(100% - 40px));padding:40px 0}.top-cylinder{width:min(760px,94vw);min-height:78px;margin:0 auto 42px;padding:20px 36px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.035) 48%,rgba(0,200,83,.08));box-shadow:inset 0 1px rgba(255,255,255,.2),inset 0 -14px 32px rgba(0,0,0,.2),0 18px 55px rgba(0,0,0,.38);backdrop-filter:blur(24px);cursor:pointer}.top-cylinder span{font-size:clamp(.95rem,2.2vw,1.35rem);font-weight:700}.hero{margin-bottom:42px}.headline{margin:0;font-size:clamp(2.15rem,7vw,5.7rem);line-height:1.04;font-weight:800}.subline{margin:14px 0;color:var(--muted);font-size:clamp(1rem,2.2vw,1.5rem)}.label{display:flex;justify-content:center;gap:12px;margin-bottom:10px;color:var(--muted);font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.value{color:var(--text);font-size:clamp(1.2rem,3vw,2rem)}.bar{height:clamp(60px,10vw,92px);background:var(--track);border-radius:24px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#00c853,#00ad49)}.sound{position:fixed;top:18px;right:18px;width:46px;height:46px;border:1px solid rgba(255,255,255,.12);border-radius:50%;background:#141719;color:#fff;font-size:1.15rem}.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:20px;background:rgba(0,0,0,.82);backdrop-filter:blur(12px)}.modal.show{display:grid}.modal-card{width:min(820px,100%);max-height:95vh;overflow:auto;background:#111416;border:1px solid rgba(255,255,255,.13);border-radius:28px;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin:0 4px 14px}.close{background:none;border:0;color:#fff;font-size:28px}.format-switch{display:flex;justify-content:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.format-switch button{padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:#1b2023;color:#fff;font-weight:700}.format-switch button.active{background:#00c853;color:#031007}.modal video{width:100%;max-height:68vh;display:block;object-fit:contain;border-radius:18px;background:#050607}.actions{display:flex;justify-content:center;gap:12px;margin-top:16px}.download{padding:13px 22px;border-radius:999px;background:#00c853;color:#031007;font-weight:800;text-decoration:none}.status{color:var(--muted)}</style></head><body><button class="sound" id="sound" aria-label="Toggle sound">🔊</button><main><div class="top-cylinder" id="videoTrigger"><span>Progress Bar Of the Year By Laxman Nepal</span></div><header class="hero"><h1 class="headline"><span id="yearPercent">0</span>% of <span id="currentYear">2026</span> has passed</h1><p class="subline" id="dateText">Loading date…</p></header><section><div class="label"><span>Year progress</span><span class="value"><span id="progressValue">0.0</span>%</span></div><div class="bar"><div class="fill" id="progressBar"></div></div></section></main><div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><strong>1080p 30 FPS Year Progress Video</strong><button class="close" id="close">×</button></div><div class="format-switch"><button data-format="16:9" class="active">16:9 1080p</button><button data-format="9:16">9:16 1080p</button></div><div id="videoArea"><div class="status">Preparing synchronized videos…</div></div><div class="actions" id="actions"></div></div></div><script>
(()=> {
  const $ = id => document.getElementById(id);
  const now = new Date();
  const year = now.getFullYear();
  const start = new Date(year,0,1);
  const end = new Date(year+1,0,1);
  const percent = Math.max(0, Math.min(100, ((now-start)/(end-start))*100));

  const yearEl = $("currentYear");
  if(yearEl) yearEl.textContent = year;
  $("yearPercent").textContent = Math.floor(percent);
  $("progressValue").textContent = percent.toFixed(1);
  $("progressBar").style.width = percent + "%";
  $("dateText").textContent = new Intl.DateTimeFormat("en-US",{month:"long",day:"numeric",year:"numeric"}).format(now);

  const modal=$("modal"), trigger=$("videoTrigger"), close=$("close");
  if(trigger) trigger.onclick=()=>{ modal.classList.add("show"); };
  if(close) close.onclick=()=>modal.classList.remove("show");
  if(modal) modal.onclick=e=>{if(e.target===modal) modal.classList.remove("show")};

  const sound=$("sound");
  if(sound) sound.onclick=()=>{ sound.textContent=sound.textContent==="🔊"?"🔇":"🔊"; };
})();
</script></body></html>
