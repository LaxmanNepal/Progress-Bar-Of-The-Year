<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Graphics Studio — Progress of the Year</title><style>:root{--bg:#050806;--p:#101812dd;--l:#fff2;--t:#f5faf7;--m:#89968e;--a:#55f09b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#07371d,transparent 35%),var(--bg);color:var(--t);font-family:system-ui;padding:14px}.wrap{max-width:1200px;margin:auto}.nav{position:sticky;top:8px;z-index:5;display:flex;gap:7px;align-items:center;overflow:auto;padding:9px;border:1px solid var(--l);background:#07100bdd;backdrop-filter:blur(18px);border-radius:16px}.nav a{white-space:nowrap;color:var(--m);text-decoration:none;padding:8px 10px;border-radius:10px;font-size:.76rem;font-weight:800}.nav a.active,.nav a:hover{background:#55f09b18;color:var(--a)}.hero{padding:45px 5px 28px}.ey{color:var(--a);font-size:.68rem;font-weight:900;letter-spacing:.16em}.hero h1{font-size:clamp(2.5rem,7vw,5.8rem);letter-spacing:-.07em;line-height:.9;margin:12px 0}.hero p{color:var(--m);max-width:680px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid var(--l);background:var(--p);border-radius:20px;padding:10px;overflow:hidden}.card canvas{width:100%;display:block;border-radius:13px;background:#111}.card b{display:block;margin:11px 4px 3px}.card small{display:block;color:var(--m);padding:0 4px 7px}.btn{display:inline-block;margin-top:18px;padding:11px 15px;border-radius:11px;background:var(--a);color:#001b0b;text-decoration:none;font-weight:900}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.grid{grid-template-columns:1fr}.hero{padding-top:30px}}</style></head><body><main class="wrap"><nav class="nav"><a href="../">Studio</a><a href="../content-factory.html">Factory</a><a class="active" href="./">Graphics</a><a href="../videos/">Videos</a><a href="../batch/">Batch</a><a href="../calendar/">Calendar</a><a href="../captions/">Captions</a><a href="../brand/">Brand</a><a href="../../">Dashboard</a></nav><section class="hero"><div class="ey">GRAPHICS STUDIO · LIVE PREVIEWS</div><h1>See every visual before you publish.</h1><p>All templates below render today's exact year progress. Click any preview to open the full generator.</p><a class="btn" href="../content-factory.html">Open Full Generator →</a></section><section class="grid" id="grid"></section></main><script>const xs=[['Minimal','Clean editorial'],['Circular','Progress ring'],['Glass','Glassmorphism'],['Cinematic','Dark cinematic'],['Calendar','Day visualization'],['Split','Passed vs left'],['Gradient','Bold gradient'],['Dashboard','Data focused'],['Seasonal','Season mood'],['Quote','Motivation + data'],['Monochrome','Editorial'],['Neon','Futuristic']];function data(){let n=new Date(),y=n.getFullYear(),s=new Date(y,0,1),e=new Date(y+1,0,1),p=(n-s)/(e-s);return{p,y,day:Math.floor((n-s)/864e5)+1,left:Math.ceil((e-n)/864e5)}}function draw(c,i){let d=data(),ctx=c.getContext('2d'),w=600,h=500;c.width=w;c.height=h;ctx.fillStyle=i===10?'#eee':i===6?'#29114a':i===11?'#061c31':'#07110c';ctx.fillRect(0,0,w,h);if(i!==0&&i!==10){let g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,i===11?'#0a426e':'#12351f');g.addColorStop(1,i===6?'#8b236e':'#020403');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}ctx.textAlign='center';ctx.fillStyle=i===10?'#111':'#fff';ctx.font='800 24px Arial';ctx.fillText(xs[i][0].toUpperCase(),w/2,75);ctx.font='900 92px Arial';ctx.fillStyle=i===10?'#111':'#55f09b';ctx.fillText((d.p*100).toFixed(2)+'%',w/2,235);ctx.font='700 24px Arial';ctx.fillStyle=i===10?'#444':'#b8c7be';ctx.fillText('DAY '+d.day+' · '+d.left+' DAYS LEFT',w/2,285);if(i===1){ctx.strokeStyle='#ffffff22';ctx.lineWidth=32;ctx.beginPath();ctx.arc(w/2,250,150,-Math.PI/2,Math.PI*1.5);ctx.stroke();ctx.strokeStyle='#55f09b';ctx.beginPath();ctx.arc(w/2,250,150,-Math.PI/2,-Math.PI/2+Math.PI*2*d.p);ctx.stroke()}else{ctx.fillStyle=i===10?'#bbb':'#ffffff18';ctx.roundRect(70,340,460,34,18);ctx.fill();ctx.fillStyle='#55f09b';ctx.roundRect(70,340,460*d.p,34,18);ctx.fill()}ctx.font='700 16px Arial';ctx.fillStyle=i===10?'#555':'#83938a';ctx.fillText('PROGRESS OF THE YEAR · '+d.y,w/2,440)}xs.forEach((x,i)=>{let a=document.createElement('article');a.className='card';let c=document.createElement('canvas');draw(c,i);a.append(c);a.innerHTML+='<b>'+String(i+1).padStart(2,'0')+' · '+x[0]+'</b><small>'+x[1]+' · live preview</small>';a.onclick=()=>location.href='../content-factory.html#'+x[0].toLowerCase();document.getElementById('grid').append(a)});</script></body></html>
