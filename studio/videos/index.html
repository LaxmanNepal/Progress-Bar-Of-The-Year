<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Studio — Progress of the Year</title><style>:root{--bg:#050806;--p:#101812dd;--l:#fff2;--t:#f5faf7;--m:#89968e;--a:#55f09b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#07371d,transparent 35%),var(--bg);color:var(--t);font-family:system-ui;padding:14px}.wrap{max-width:1200px;margin:auto}.nav{position:sticky;top:8px;z-index:5;display:flex;gap:7px;overflow:auto;padding:9px;border:1px solid var(--l);background:#07100bdd;backdrop-filter:blur(18px);border-radius:16px}.nav a{white-space:nowrap;color:var(--m);text-decoration:none;padding:8px 10px;border-radius:10px;font-size:.76rem;font-weight:800}.nav a.active,.nav a:hover{background:#55f09b18;color:var(--a)}.hero{padding:45px 5px 28px}.ey{color:var(--a);font-size:.68rem;font-weight:900;letter-spacing:.16em}.hero h1{font-size:clamp(2.5rem,7vw,5.8rem);letter-spacing:-.07em;line-height:.9;margin:12px 0}.hero p{color:var(--m);max-width:680px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{border:1px solid var(--l);background:var(--p);border-radius:22px;padding:12px;overflow:hidden}.preview{position:relative;aspect-ratio:9/16;background:#07110c;border-radius:15px;overflow:hidden}.preview canvas{width:100%;height:100%;display:block}.play{position:absolute;inset:0;display:grid;place-items:center;font-size:3rem;text-shadow:0 4px 20px #000}.card b{display:block;margin:11px 3px 3px}.card small{color:var(--m);padding:0 3px 7px;display:block}.btn{display:inline-block;margin-top:18px;padding:11px 15px;border-radius:11px;background:var(--a);color:#001b0b;text-decoration:none;font-weight:900}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><nav class="nav"><a href="../">Studio</a><a href="../content-factory.html">Factory</a><a href="../graphics/">Graphics</a><a class="active" href="./">Videos</a><a href="../batch/">Batch</a><a href="../calendar/">Calendar</a><a href="../captions/">Captions</a><a href="../brand/">Brand</a><a href="../../">Dashboard</a></nav><section class="hero"><div class="ey">VIDEO STUDIO · LIVE PREVIEWS</div><h1>Preview the whole video series.</h1><p>These animated concepts share the same daily data but use different visual stories, so your page doesn't look repetitive.</p><a class="btn" href="../content-factory.html#videos">Open Video Generator →</a></section><section class="grid" id="grid"></section></main><script>const xs=[['Daily Vertical','5–15 sec · 9:16'],['Daily Square','5–15 sec · 1:1'],['Cinematic 16:9','10–30 sec · landscape'],['Weekly Recap','15–30 sec · weekly'],['Monthly Recap','15–30 sec · monthly'],['Quarter Recap','20–30 sec · quarter'],['Milestone','10–15 sec · 25/50/75/100'],['New Year Countdown','10–30 sec · December'],['Quote + Data','10–15 sec · motivation']];function d(){let n=new Date(),y=n.getFullYear(),s=new Date(y,0,1),e=new Date(y+1,0,1),p=(n-s)/(e-s);return{p,y,day:Math.floor((n-s)/864e5)+1,left:Math.ceil((e-n)/864e5)}}function preview(c,i){let z=d(),x=c.getContext('2d'),w=360,h=640;c.width=w;c.height=h;x.fillStyle=i===2?'#020305':i===7?'#101526':i===8?'#21120a':'#06100a';x.fillRect(0,0,w,h);let g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#12351f');g.addColorStop(1,i===2?'#101827':'#020403');x.fillStyle=g;x.fillRect(0,0,w,h);x.textAlign='center';x.fillStyle='#fff';x.font='800 16px Arial';x.fillText(xs[i][0].toUpperCase(),w/2,70);x.font='900 55px Arial';x.fillStyle='#55f09b';x.fillText((z.p*100).toFixed(2)+'%',w/2,260);x.font='700 16px Arial';x.fillStyle='#b8c7be';x.fillText('DAY '+z.day+' · '+z.left+' DAYS LEFT',w/2,305);x.fillStyle='#ffffff18';x.roundRect(40,365,280,22,12);x.fill();x.fillStyle='#55f09b';x.roundRect(40,365,280*z.p,22,12);x.fill();x.font='700 12px Arial';x.fillStyle='#83938a';x.fillText('PROGRESS OF THE YEAR · '+z.y,w/2,570)}xs.forEach((v,i)=>{let a=document.createElement('article');a.className='card';a.innerHTML='<div class="preview"><canvas></canvas><div class="play">▶</div></div><b>'+String(i+1).padStart(2,'0')+' · '+v[0]+'</b><small>'+v[1]+' · animated concept</small>';preview(a.querySelector('canvas'),i);a.onclick=()=>location.href='../content-factory.html#videos';document.getElementById('grid').append(a)});</script></body></html>
